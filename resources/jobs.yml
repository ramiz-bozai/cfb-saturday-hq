resources:
  jobs:
    saturday_hq_weekly:
      name: saturday-hq-weekly-refresh
      schedule:
        # Sundays 10:00 ET, after the Saturday slate is final
        quartz_cron_expression: "0 0 10 ? * SUN"
        timezone_id: America/New_York
        pause_status: PAUSED
      tasks:
        - task_key: weekly_refresh
          notebook_task:
            notebook_path: ../notebooks/07_weekly_refresh.py
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2

    saturday_hq_backfill:
      name: saturday-hq-historical-backfill
      tasks:
        - task_key: download_historical
          notebook_task:
            notebook_path: ../notebooks/01_download_historical_to_volume.py
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
        - task_key: bronze
          depends_on:
            - task_key: download_historical
          notebook_task:
            notebook_path: ../notebooks/02_bronze_from_volume.py
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/03_silver.py
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/04_gold.py
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
