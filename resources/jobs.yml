resources:
  jobs:
    saturday_hq_daily:
      name: saturday-hq-daily-refresh
      schedule:
        quartz_cron_expression: "0 0 10 * * ?"
        timezone_id: America/New_York
        pause_status: PAUSED
      tasks:
        - task_key: daily_refresh
          notebook_task:
            notebook_path: ../notebooks/07_daily_refresh.py
            base_parameters:
              catalog: ${var.catalog}
              current_season: ${var.current_season}
              secret_scope: ${var.secret_scope}
              secret_key: ${var.secret_key}
              model_name: saturday_hq_matchup
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2

    saturday_hq_backfill:
      name: saturday-hq-historical-backfill
      tasks:
        - task_key: download_historical
          notebook_task:
            notebook_path: ../notebooks/01_download_historical_to_volume.py
            base_parameters:
              catalog: ${var.catalog}
              history_start_year: ${var.history_start_year}
              current_season: ${var.current_season}
              secret_scope: ${var.secret_scope}
              secret_key: ${var.secret_key}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
        - task_key: bronze
          depends_on:
            - task_key: download_historical
          notebook_task:
            notebook_path: ../notebooks/02_bronze_from_volume.py
            base_parameters:
              catalog: ${var.catalog}
              mode: historical
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/03_silver.py
            base_parameters:
              catalog: ${var.catalog}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/04_gold.py
            base_parameters:
              catalog: ${var.catalog}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
