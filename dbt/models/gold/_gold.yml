version: 2

# Descriptions here become Unity Catalog comments (persist_docs in dbt_project.yml), so they are
# what Genie and Catalog Explorer show. docs/DATA_DICTIONARY.md carries the long-form version,
# including measured ranges and coverage gaps.

models:
  - name: gold_team_week
    description: >
      Team-season-week form (record, point differential, last-3 margin) joined to season
      SP+/PPA/talent/recruiting. This is the as-of feature source for game_features. Cumulative
      columns include the row's source game, so consumers must join on start_date < game start_date.
    columns:
      - name: season
        tests: [not_null]
      - name: season_type
        description: regular or postseason; part of the grain because their week numbers overlap.
        tests: [not_null]
      - name: team
        tests: [not_null]
      - name: week
        description: Week within season_type. Record columns are cumulative through this row's game.
      - name: start_date
        description: Source game's start timestamp and the chronology key for all running form.
        tests: [not_null]
      - name: conference
        description: >
          Conference as of THIS season, before any later realignment — a 2016 Oregon row reads
          Pac-12, not Big Ten. Correct for historical reporting; do not restate it as current.
      - name: conference_group
        description: Power4 / G6 / Independent / Other.
      - name: game_id
        description: The game this row's week is anchored to — that week's individual result.
      - name: opponent
        description: Who the team played that week.
      - name: is_home
        description: Whether the team was at home that week.
      - name: points_for
        description: Points the team scored in that week's game, not a season total.
      - name: points_against
        description: Points the team allowed in that week's game, not a season total.
      - name: won
        description: Whether the team won that week's game.
      - name: games_played
        description: Games played through this week, including non-FBS opponents.
      - name: wins
        description: Wins through this week, including against non-FBS opponents.
      - name: losses
        description: Losses through this week, including against non-FBS opponents.
      - name: fbs_games_played
        description: Games against FBS opponents through this week.
      - name: fbs_wins
        description: Wins against FBS opponents through this week.
      - name: ppa_offense_passing
        description: This season's offensive PPA per play on passes. Higher is better.
      - name: ppa_offense_rushing
        description: This season's offensive PPA per play on runs. Higher is better.
      - name: ppa_defense_passing
        description: This season's PPA allowed per play against the pass. Lower is better.
      - name: ppa_defense_rushing
        description: This season's PPA allowed per play against the run. Lower is better.
      - name: win_pct
        description: Literal record, including games against non-FBS opponents. Use this for reporting.
      - name: win_pct_fbs
        description: >
          Record against FBS opponents only. Null before a team's first FBS game of the
          season. This is what the model uses.
      - name: point_diff
        description: Cumulative points scored minus points allowed.
      - name: avg_margin_l3
        description: Average margin over the last 3 completed games, opponent division ignored.
      - name: avg_margin_l3_fbs
        description: >
          Average margin over the last 3 FBS games (not the FBS games among the last 3).
          Non-FBS margins average roughly double, so this is the comparable version.
      - name: sp_overall
        description: >
          This season's SP+, in net points per game against an average opponent. Higher is
          better. Reporting only — for a finished season it is computed from every game in it.
      - name: sp_offense
        description: This season's adjusted points scored per game. Higher is better.
      - name: sp_defense
        description: This season's adjusted points allowed per game. LOWER IS BETTER.
      - name: sp_special_teams
        description: Points of special-teams value. Higher is better. Missing for 2020-2021.
      - name: sp_sos
        description: Schedule strength as a win probability, so HIGHER MEANS EASIER. Only populated 2015-2018.
      - name: sp_rank
        description: Rank by sp_overall, 1 = best.
      - name: ppa_offense
        description: This season's expected points added per offensive play. Higher is better.
      - name: ppa_defense
        description: This season's expected points added allowed per play. LOWER IS BETTER.
      - name: sp_overall_prior
        description: Last season's SP+. Knowable before kickoff, so this is the model-safe vintage.
      - name: sp_offense_prior
        description: Last season's adjusted points scored per game. Model-safe vintage.
      - name: sp_defense_prior
        description: Last season's adjusted points allowed per game. Lower is better. Model-safe vintage.
      - name: ppa_offense_prior
        description: Last season's offensive PPA per play. Model-safe vintage.
      - name: ppa_defense_prior
        description: Last season's PPA allowed per play. Lower is better. Model-safe vintage.
      - name: talent
        description: >
          247Sports composite roster talent, known before the season. Higher is better. A 0 for
          Air Force, Army or Navy from 2022 is a real value meaning almost no composite-rated
          recruits, not a missing one. Air Force and Navy are genuinely null for 2025.
      - name: recruiting_points
        description: Composite score of this season's incoming signing class. Higher is better.
      - name: recruiting_rank
        description: Rank of this season's signing class, 1 = best.
      - name: is_notre_dame
        description: Drives the Notre Dame automatic-qualifier rule in the CFP logic.

  - name: gold_game_features
    description: >
      One row per FBS-vs-FBS game with both sides' as-of features, market line fields,
      and labels. Market columns are for display only and are excluded from FEATURE_COLS.
      Form is drawn strictly from games whose start timestamp precedes the predicted game.
    columns:
      - name: game_id
        tests: [unique, not_null]
      - name: home_feature_week
        description: >
          Week label of the team_week row supplying home form. Compare timestamps, not this field,
          for chronology because postseason week numbers restart.
      - name: away_feature_week
        description: Week label of the team_week row supplying away form.
      - name: home_feature_start_date
        description: Source timestamp for home form; always strictly before the game's start_date.
      - name: away_feature_start_date
        description: Source timestamp for away form; always strictly before the game's start_date.
      - name: margin_home
        description: home_points - away_points. Positive means the home team won.
      - name: total_points
        description: Combined score, comparable against market_ou.
      - name: market_spread
        description: >
          Closing spread from the HOME team's perspective. Negative means the home team is
          favoured; -7 is the home team by a touchdown.
      - name: line_provider
        description: Provider of market_spread and market_ou.
      - name: market_spread_open
        description: The spread when the game opened, before line movement.
      - name: market_ou_open
        description: The total when the game opened, before line movement.
      - name: opening_line_provider
        description: Provider of market_spread_open and market_ou_open.
      - name: market_ou
        description: Market's predicted combined score (the total, or over/under).
      - name: market_home_ml
        description: American-odds price on a straight home win.
      - name: market_away_ml
        description: American-odds price on a straight away win from the same provider as the home price.
      - name: moneyline_provider
        description: Provider of both market_home_ml and market_away_ml.
      - name: market_home_win_prob_implied
        description: Implied from the American home moneyline, vig included. Market context, not a recommendation.
      - name: market_home_win_prob_novig
        description: >
          Home moneyline de-vigged against the same provider's away price, so the two sides sum
          to 1. This is the version to compare with a model probability; null when the game has
          no complete two-way moneyline row.
      - name: sp_overall_diff
        description: This season's SP+ difference. Reporting only — for a finished season it is
          computed from the game itself. FEATURE_COLS uses sp_overall_diff_prior.
      - name: sp_overall_diff_prior
        description: Prior-season SP+ difference, knowable before kickoff. Used by the model.
      - name: ppa_offense_diff
        description: >
          This season's home minus away offensive PPA. Reporting only, for the same reason as
          sp_overall_diff. FEATURE_COLS uses ppa_offense_diff_prior.
      - name: ppa_defense_diff
        description: >
          This season's home minus away PPA allowed. Reporting only. Lower is better for a
          defence, so a negative value favours the home team.
      - name: ppa_offense_diff_prior
        description: Home minus away prior-season offensive PPA. Positive favours the home team.
      - name: ppa_defense_diff_prior
        description: >
          Home minus away prior-season PPA allowed. Lower is better for a defence, so a NEGATIVE
          value favours the home team.
      - name: talent_diff
        description: >
          Home minus away roster talent, same season (signing day precedes the season). Distorted
          in games involving the service academies, whose talent is 0 for coverage reasons.

  - name: gold_matchup_card
    description: >
      Serving view for the App and briefs: game features plus model probability and the
      model-minus-market delta. A view so that new scoring runs show up without another
      dbt run.
    columns:
      - name: game_id
        tests: [unique, not_null]
      - name: model_home_win_prob
        description: Null until the scoring notebook has run for that game's season.
      - name: model_version
        description: Registered model version that produced the probability.
      - name: scored_at
        description: When the scoring run wrote this prediction.
      - name: model_minus_market_home
        description: >
          model_home_win_prob minus the de-vigged market probability. A disagreement, not an
          edge. Null when the game has no two-way moneyline.

  - name: mv_season_preview_team
    description: >
      Databricks metric view for Season Preview team KPIs (Genie). Joins returning_production_team,
      transfer_dependency, and portal_team_ledger. Query with MEASURE(metric_name) and GROUP BY
      season/team/conference. FBS teams with a known conference only.

  - name: mv_unit_continuity
    description: >
      Databricks metric view for Season Preview unit continuity (Genie). Grain is team x
      position_group x season. Joins returning_production_team for conference and replacement_risk
      for departed_share when a callout exists.
