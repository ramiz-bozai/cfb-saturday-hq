version: 2

# Descriptions here become Unity Catalog comments (persist_docs in dbt_project.yml), so they are
# what Genie and Catalog Explorer show. docs/DATA_DICTIONARY.md carries the long-form version,
# including measured ranges and coverage gaps.

models:
  - name: gold_team_week
    description: >
      Team-season-week form (record, point differential, last-3 margin) joined to season
      SP+/PPA/talent/recruiting. This is the as-of feature source for game_features. Cumulative
      columns include the row's source game, so consumers must join on start_date < game start_date.
    columns:
      - name: season
        tests: [not_null]
      - name: season_type
        description: regular or postseason; part of the grain because their week numbers overlap.
        tests: [not_null]
      - name: team
        tests: [not_null]
      - name: week
        description: Week within season_type. Record columns are cumulative through this row's game.
      - name: start_date
        description: Source game's start timestamp and the chronology key for all running form.
        tests: [not_null]
      - name: conference
        description: >
          Conference as of THIS season, before any later realignment — a 2016 Oregon row reads
          Pac-12, not Big Ten. Correct for historical reporting; do not restate it as current.
      - name: conference_group
        description: Power4 / G6 / Independent / Other.
      - name: game_id
        description: The game this row's week is anchored to — that week's individual result.
      - name: opponent
        description: Who the team played that week.
      - name: is_home
        description: Whether the team was at home that week.
      - name: points_for
        description: Points the team scored in that week's game, not a season total.
      - name: points_against
        description: Points the team allowed in that week's game, not a season total.
      - name: won
        description: Whether the team won that week's game.
      - name: games_played
        description: Games played through this week, including non-FBS opponents.
      - name: wins
        description: Wins through this week, including against non-FBS opponents.
      - name: losses
        description: Losses through this week, including against non-FBS opponents.
      - name: fbs_games_played
        description: Games against FBS opponents through this week.
      - name: fbs_wins
        description: Wins against FBS opponents through this week.
      - name: ppa_offense_passing
        description: This season's offensive PPA per play on passes. Higher is better.
      - name: ppa_offense_rushing
        description: This season's offensive PPA per play on runs. Higher is better.
      - name: ppa_defense_passing
        description: This season's PPA allowed per play against the pass. Lower is better.
      - name: ppa_defense_rushing
        description: This season's PPA allowed per play against the run. Lower is better.
      - name: win_pct
        description: Literal record, including games against non-FBS opponents. Use this for reporting.
      - name: win_pct_fbs
        description: >
          Record against FBS opponents only. Null before a team's first FBS game of the
          season. This is what the model uses.
      - name: point_diff
        description: Cumulative points scored minus points allowed.
      - name: avg_margin_l3
        description: Average margin over the last 3 completed games, opponent division ignored.
      - name: avg_margin_l3_fbs
        description: >
          Average margin over the last 3 FBS games (not the FBS games among the last 3).
          Non-FBS margins average roughly double, so this is the comparable version.
      - name: sp_overall
        description: >
          This season's SP+, in net points per game against an average opponent. Higher is
          better. Reporting only — for a finished season it is computed from every game in it.
      - name: sp_offense
        description: This season's adjusted points scored per game. Higher is better.
      - name: sp_defense
        description: This season's adjusted points allowed per game. LOWER IS BETTER.
      - name: sp_special_teams
        description: Points of special-teams value. Higher is better. Missing for 2020-2021.
      - name: sp_sos
        description: Schedule strength as a win probability, so HIGHER MEANS EASIER. Only populated 2015-2018.
      - name: sp_rank
        description: Rank by sp_overall, 1 = best.
      - name: ppa_offense
        description: This season's expected points added per offensive play. Higher is better.
      - name: ppa_defense
        description: This season's expected points added allowed per play. LOWER IS BETTER.
      - name: sp_overall_prior
        description: Last season's SP+. Knowable before kickoff, so this is the model-safe vintage.
      - name: sp_offense_prior
        description: Last season's adjusted points scored per game. Model-safe vintage.
      - name: sp_defense_prior
        description: Last season's adjusted points allowed per game. Lower is better. Model-safe vintage.
      - name: ppa_offense_prior
        description: Last season's offensive PPA per play. Model-safe vintage.
      - name: ppa_defense_prior
        description: Last season's PPA allowed per play. Lower is better. Model-safe vintage.
      - name: talent
        description: >
          247Sports composite roster talent, known before the season. Higher is better. A 0 for
          Air Force, Army or Navy from 2022 is a real value meaning almost no composite-rated
          recruits, not a missing one. Air Force and Navy are genuinely null for 2025.
      - name: recruiting_points
        description: Composite score of this season's incoming signing class. Higher is better.
      - name: recruiting_rank
        description: Rank of this season's signing class, 1 = best.
      - name: is_notre_dame
        description: Drives the Notre Dame automatic-qualifier rule in the CFP logic.

  - name: gold_game_features
    description: >
      One row per FBS-vs-FBS game with both sides' as-of features, market line fields,
      and labels. Market columns are for display only and are excluded from FEATURE_COLS.
      Form is drawn strictly from games whose start timestamp precedes the predicted game.
    columns:
      - name: game_id
        tests: [unique, not_null]
      - name: home_feature_week
        description: >
          Week label of the team_week row supplying home form. Compare timestamps, not this field,
          for chronology because postseason week numbers restart.
      - name: away_feature_week
        description: Week label of the team_week row supplying away form.
      - name: home_feature_start_date
        description: Source timestamp for home form; always strictly before the game's start_date.
      - name: away_feature_start_date
        description: Source timestamp for away form; always strictly before the game's start_date.
      - name: margin_home
        description: home_points - away_points. Positive means the home team won.
      - name: total_points
        description: Combined score, comparable against market_ou.
      - name: market_spread
        description: >
          Closing spread from the HOME team's perspective. Negative means the home team is
          favoured; -7 is the home team by a touchdown.
      - name: line_provider
        description: Provider of market_spread and market_ou.
      - name: market_spread_open
        description: The spread when the game opened, before line movement.
      - name: market_ou_open
        description: The total when the game opened, before line movement.
      - name: opening_line_provider
        description: Provider of market_spread_open and market_ou_open.
      - name: market_ou
        description: Market's predicted combined score (the total, or over/under).
      - name: market_home_ml
        description: American-odds price on a straight home win.
      - name: market_away_ml
        description: American-odds price on a straight away win from the same provider as the home price.
      - name: moneyline_provider
        description: Provider of both market_home_ml and market_away_ml.
      - name: market_home_win_prob_implied
        description: Implied from the American home moneyline, vig included. Market context, not a recommendation.
      - name: market_home_win_prob_novig
        description: >
          Home moneyline de-vigged against the same provider's away price, so the two sides sum
          to 1. This is the version to compare with a model probability; null when the game has
          no complete two-way moneyline row.
      - name: sp_overall_diff
        description: This season's SP+ difference. Reporting only — for a finished season it is
          computed from the game itself. FEATURE_COLS uses sp_overall_diff_prior.
      - name: sp_overall_diff_prior
        description: Prior-season SP+ difference, knowable before kickoff. Used by the model.
      - name: ppa_offense_diff
        description: >
          This season's home minus away offensive PPA. Reporting only, for the same reason as
          sp_overall_diff. FEATURE_COLS uses ppa_offense_diff_prior.
      - name: ppa_defense_diff
        description: >
          This season's home minus away PPA allowed. Reporting only. Lower is better for a
          defence, so a negative value favours the home team.
      - name: ppa_offense_diff_prior
        description: Home minus away prior-season offensive PPA. Positive favours the home team.
      - name: ppa_defense_diff_prior
        description: >
          Home minus away prior-season PPA allowed. Lower is better for a defence, so a NEGATIVE
          value favours the home team.
      - name: talent_diff
        description: >
          Home minus away roster talent, same season (signing day precedes the season). Distorted
          in games involving the service academies, whose talent is 0 for coverage reasons.

  - name: gold_matchup_card
    description: >
      Serving view for the App and briefs: game features plus model probability and the
      model-minus-market delta. A view so that new scoring runs show up without another
      dbt run.
    columns:
      - name: game_id
        tests: [unique, not_null]
      - name: model_home_win_prob
        description: Null until the scoring notebook has run for that game's season.
      - name: model_version
        description: Registered model version that produced the probability.
      - name: scored_at
        description: When the scoring run wrote this prediction.
      - name: model_minus_market_home
        description: >
          model_home_win_prob minus the de-vigged market probability. A disagreement, not an
          edge. Null when the game has no two-way moneyline.

  - name: gold_departures
    description: >
      Every player a program lost for a given season, in one place - transfer portal moves, NFL
      draft picks and matched undrafted free agents - each carrying the prior-season production
      earned at the school being left. THIS is the table for "who did a team lose" and "how much
      production departed". Do not use portal_moves for that: it holds portal moves only and
      misses draft and UDFA exits, which are often the largest losses. unit_continuity and
      replacement_risk cover the same population but aggregate to team x position_group, so they
      cannot name players. Summing prior_* here reconciles with replacement_risk.departed_metric
      once position_group = 'OTHER' is excluded.
    columns:
      - name: season
        description: >
          Season the player is gone FOR, so 2026 means absent from the 2026 roster. prior_*
          columns describe season - 1, the player's final season at this team.
        tests: [not_null]
      - name: team
        description: The school that lost the player.
        tests: [not_null]
      - name: player_name
        description: Full name, normalized across the portal, draft and UDFA sources.
      - name: position
        description: >
          Normalized abbreviation, consistent across all three sources: QB, RB, WR, TE, OL, DL,
          LB, DB, K, P, LS, OTHER. Receivers and tight ends are separate here even though
          position_group merges them, so filter position = 'WR' for wide receivers specifically
          and position_group = 'WR/TE' for the pass-catching unit as a whole. Corners and
          safeties stay merged as DB because UDFA records cannot distinguish them.
      - name: position_group
        description: >
          Unit bucket, matching every other Season Preview table. The ONLY values are QB, RB,
          WR/TE, OL, DL, LB, DB, ST, OTHER. There is no 'WR' or 'TE' value on this column - use
          the position column for that split.
      - name: departure_type
        description: >
          One of portal, draft, udfa. A player who entered the portal and was also drafted counts
          once, as portal, matching the dedupe in replacement_risk.
      - name: destination
        description: >
          The new school for portal moves, the NFL club for draft picks and UDFAs. Null when a
          portal entrant has not committed anywhere.
      - name: draft_round
        description: Draft round for departure_type = draft. Null for portal and UDFA.
      - name: overall_pick
        description: Overall selection number for departure_type = draft. Null for portal and UDFA.
      - name: prior_rec_yds
        description: >
          Receiving yards in the player's final season at this team. Zero rather than null when
          there was no production, so sums are safe.
      - name: prior_production_score
        description: Composite production in the final season at this team. Good default for ranking losses.

  - name: gold_portal_moves
    description: >
      One row per transfer portal move, enriched with the player's prior-season usage and
      production at the origin school. Use this for portal ARRIVALS (destination = a team). For
      players a team LOST, use gold_departures instead - this table covers only the portal and
      omits NFL draft and UDFA exits, which are frequently a team's biggest losses. Prior_*
      columns describe the season before the move and are null when the player has no matched
      prior-season stat line.
    columns:
      - name: season
        description: Season the player is transferring INTO, so 2026 covers the 2025-26 portal cycle.
      - name: position
        description: >
          Raw position abbreviation (WR, TE, CB, EDGE, ...). Use this only when a question is
          genuinely about a single position; unit-level questions belong on position_group.
      - name: position_group
        description: >
          Unit bucket. The ONLY values are QB, RB, WR/TE, OL, DL, LB, DB, ST, OTHER. Receivers and
          tight ends share one bucket, so filter position_group = 'WR/TE' for either; there is no
          'WR' or 'TE' value. Likewise OL covers every offensive line position, DL covers ends and
          tackles and edge, DB covers corners and safeties, and ST covers kickers, punters,
          returners and long snappers.
      - name: origin
        description: School the player left. Null when the origin is unknown or non-FBS.
      - name: destination
        description: School the player joined. Null while the player is uncommitted or leaves FBS.
      - name: eligibility
        description: One of Immediate, PendingAppeal, TBD.
      - name: impact_class
        description: >
          One of impact, depth, unknown. Impact means the move projects to change the two-deep;
          unknown means there was neither prior production nor a talent rating to judge on, so it
          is not the same as depth.
      - name: projected_starter
        description: Boolean flag from the documented usage/production/talent gates, not a depth chart.
      - name: prior_rec_yds
        description: Receiving yards the season before the move. Null when no prior stat line matched.

  - name: gold_roster_snapshot
    description: >
      Player-level roster for a target season, one row per player per team. Prefers a published
      CFBD roster; before camp CFBD usually has none, so the roster is constructed from the prior
      season minus portal departures and NFL exits, plus portal arrivals. This table holds every
      FBS team, so anti-joins looking for who LEFT a team must constrain team on both sides -
      otherwise a departed player still matches at his new school.
    columns:
      - name: season
        description: Season the roster describes. Prior_* columns come from season - 1.
      - name: position_group
        description: >
          Unit bucket. The ONLY values are QB, RB, WR/TE, OL, DL, LB, DB, ST, OTHER. Receivers and
          tight ends share the WR/TE bucket; there is no 'WR' or 'TE' value.
      - name: roster_source
        description: >
          published when CFBD has posted a roster for this season, constructed when it was carried
          forward from the prior season. Constructed rosters keep players who simply exhausted
          eligibility, because only portal moves and NFL exits are subtracted.
      - name: is_transfer_addition
        description: True for incoming portal arrivals on a constructed roster; always false when published.
      - name: class_year
        description: Eligibility year as published. Null for constructed-roster transfer arrivals.

  - name: gold_unit_continuity
    description: >
      Continuity grade per team, position group and season. The right table for how much of a unit
      returns and how much churned. Loss-side columns count portal moves plus NFL draft and UDFA
      exits; only players who quietly exhausted eligibility are missing, because no source records
      them. For the names behind these counts, use gold_departures.
    columns:
      - name: position_group
        description: >
          Unit bucket. The ONLY values are QB, RB, WR/TE, OL, DL, LB, DB, ST, OTHER. Filter
          position_group = 'WR/TE' for any receiver or tight end question; there is no 'WR' or 'TE'.
      - name: production_returning_pct
        description: Share of the unit's prior production returning, 0 to 1.
      - name: usage_returning_pct
        description: Share of the unit's prior usage returning, 0 to 1.
      - name: transfer_departures
        description: >
          Players who left the unit, counting portal moves AND NFL draft and UDFA exits despite
          the column name. Matches the row count in gold_departures for the same team, season and
          position_group. Additions are portal only, because there is no other way in.
      - name: transfer_additions
        description: Players who joined the unit via the portal.
      - name: continuity_score
        description: 0-100 blend of returning production, usage and headcount. Higher is more continuity.
      - name: replacement_risk
        description: One of high, elevated, manageable.
      - name: experience
        description: Season the returning production is measured from, not a count of years.

  - name: gold_replacement_risk
    description: >
      Replacement-risk callouts for units that lost meaningful production. Only units that trip a
      threshold appear, so an absent team-unit row means no callout, not zero departures - use
      unit_continuity for the full picture.
    columns:
      - name: position_group
        description: >
          Unit bucket. The ONLY values are QB, RB, WR/TE, OL, DL, LB, DB, ST, OTHER. There is no
          'WR' or 'TE' value.
      - name: replacement_risk
        description: One of high, elevated, manageable.
      - name: metric_name
        description: >
          Which stat the callout is measured in, chosen per unit: pass_att for QB, rec_yds for
          WR/TE, rush_yds for RB, sacks for DL, tackles or interceptions for LB and DB,
          kick_points for ST, production_score as the fallback.
      - name: departed_metric
        description: Amount of metric_name lost to departures.
      - name: prior_metric
        description: The unit's total for metric_name in the prior season.
      - name: departed_share
        description: departed_metric divided by prior_metric, 0 to 1.
      - name: callout
        description: Prebuilt display sentence. Prefer the numeric columns for analysis.

  - name: gold_qb_room
    description: >
      One row per quarterback on the target-season roster, with career and prior-season passing
      history plus the room classification repeated on every row of a team.
    columns:
      - name: qb_rank
        description: Ordering within the room, 1 = projected front of the room. Not a national rank.
      - name: is_returning_starter
        description: True when the QB started for this same team the prior season.
      - name: qb_class
        description: >
          Per-quarterback label. One of Proven elite starter, Proven average starter, Experienced
          but limited, High-upside transfer, Unproven competition, Major uncertainty.
      - name: room_class
        description: >
          Team-level room label, identical on every QB row for that team. One of Proven elite
          starter, Proven average starter, High-upside transfer, Unproven competition, Major
          uncertainty.
      - name: roster_source
        description: published or constructed, matching roster_snapshot.

  - name: gold_transfer_dependency
    description: >
      Team-season summary of how much a team leans on incoming transfers, overall and split by
      offense and defense. Offense covers QB, RB, WR/TE and OL; defense covers DL, LB and DB.
    columns:
      - name: transfer_dependency_score
        description: 0-100 composite. Higher means more of the projected contribution comes from transfers.
      - name: pct_usage_from_transfers
        description: Share of projected usage supplied by incoming transfers, 0 to 1.
      - name: critical_units_on_transfers
        description: Count of position groups whose projected starters are transfers.

  - name: gold_returning_production_team
    description: >
      Team-season returning production. Uses CFBD's published returning-production figures when
      the roster is published and CFBD has a row, otherwise computes them from the constructed
      roster.
    columns:
      - name: source
        description: cfbd when taken from CFBD's returning-production endpoint, computed otherwise.
      - name: percent_ppa
        description: Share of prior-season PPA returning, 0 to 1.
      - name: conference
        description: Conference as of this season, before any later realignment.

  - name: gold_portal_team_ledger
    description: >
      Team-season roster ledger rolled up from unit_continuity - impact and depth players in and
      out, net production and net talent. Additions are portal only; losses include NFL draft and
      UDFA exits as well as portal departures. Players who exhausted eligibility are not counted,
      because no source records them.
    columns:
      - name: impact_additions
        description: Incoming transfers classified impact by portal_moves.impact_class.
      - name: impact_losses
        description: Departing players classified impact, whether they left via the portal or the NFL.
      - name: net_production_gained
        description: Prior production added by arrivals minus prior production lost to departures.

  - name: mv_season_preview_team
    description: >
      Databricks metric view for Season Preview team KPIs (Genie). Joins returning_production_team,
      transfer_dependency, and portal_team_ledger. Query with MEASURE(metric_name) and GROUP BY
      season/team/conference. FBS teams with a known conference only.

  - name: mv_unit_continuity
    description: >
      Databricks metric view for Season Preview unit continuity (Genie). Grain is team x
      position_group x season. Joins returning_production_team for conference and replacement_risk
      for departed_share when a callout exists. position_group takes only QB, RB, WR/TE, OL, DL,
      LB, DB, ST, OTHER - receivers and tight ends share the WR/TE bucket, so there is no 'WR' or
      'TE' value to filter on.
