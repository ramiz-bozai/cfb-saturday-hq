name: cfb_saturday_hq
version: "1.0.0"
config-version: 2

profile: cfb_saturday_hq

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Root of the Unity Catalog Volume that notebook 01 writes CFBD JSONL into.
  landing_root: /Volumes/cfb_saturday_hq/cfb_bronze/cfbd_landing
  # Steady state: bronze reads the historical backfill plus every incremental/dt=.../ drop,
  # so each run automatically picks up the newest pull for the current season.
  # Only the very first build (before any incremental drop exists) needs
  # --vars '{include_incremental: false}', because read_files errors on a glob that
  # matches no files.
  include_incremental: true

models:
  cfb_saturday_hq:
    +materialized: table
    +file_format: delta
    bronze:
      +schema: cfb_bronze
      +tags: ["bronze"]
    silver:
      +schema: cfb_silver
      +tags: ["silver"]
    gold:
      +schema: cfb_gold
      +tags: ["gold"]
