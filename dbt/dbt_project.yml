name: cfb_saturday_hq
version: "1.0.0"
config-version: 2

profile: cfb_saturday_hq

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Elementary needs these so its package can override test materializations and
# upload artifacts via on-run-end hooks (dbt >= 1.8).
flags:
  require_explicit_package_overrides_for_builtin_materializations: false
  source_freshness_run_project_hooks: true

vars:
  # Root of the Unity Catalog Volume that notebook 01 writes CFBD JSONL into. Deliberately
  # NOT inside an environment catalog: dev and prod build their own bronze/silver/gold from
  # this one shared copy of the raw files, so the CFBD API is only ever called once.
  landing_root: /Volumes/cfb_saturday_hq_raw/landing/cfbd_landing
  # Steady state: bronze reads the historical backfill plus every incremental/dt=.../ drop,
  # so each run automatically picks up the newest pull for the current season.
  # Only the very first build (before any incremental drop exists) needs
  # --vars '{include_incremental: false}', because read_files errors on a glob that
  # matches no files.
  include_incremental: true

models:
  elementary:
    # Lands in <catalog>.elementary (generate_schema_name uses custom schema as-is).
    +schema: "elementary"
  cfb_saturday_hq:
    +materialized: table
    +file_format: delta
    # Push model and column descriptions into Unity Catalog as comments, so the definitions in
    # the schema files reach Genie and the Catalog Explorer instead of living only in dbt docs.
    # docs/DATA_DICTIONARY.md carries the long-form version.
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +schema: cfb_bronze
      +tags: ["bronze"]
    silver:
      +schema: cfb_silver
      +tags: ["silver"]
    gold:
      +schema: cfb_gold
      +tags: ["gold"]
    app:
      +schema: cfb_app
      +tags: ["app"]
