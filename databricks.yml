bundle:
  name: saturday-hq

include:
  - resources/*.yml

# One variable drives the whole environment split: it becomes SATURDAY_HQ_ENV on the job
# clusters (which is how the Python notebooks pick their catalog) and the --target passed to
# the dbt tasks. Raw CFBD files are shared across both, so nothing here points at them.
targets:
  dev:
    default: true
    mode: development
    workspace:
      # Uncomment and set your host:
      # host: https://YOUR_WORKSPACE.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: dev

  prod:
    mode: production
    workspace:
      # host: https://YOUR_WORKSPACE.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prod

variables:
  env:
    description: Deployment environment; selects the cfb_saturday_hq_<env> catalog
    default: dev
  history_start_year:
    description: First season to backfill
    default: "2015"
  secret_scope:
    description: Secret scope for CFBD API key
    default: cfb_saturday_hq
  secret_key:
    description: Secret key name for CFBD API key
    default: cfbd_api_key
